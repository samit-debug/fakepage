{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instagram-style login demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fafafa; color: #262626; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .column { width: 350px; }
    .panel { background: white; border: 1px solid #dbdbdb; padding: 36px 40px 24px; text-align: center; }
    .brand-logo { display: block; width: 84px; height: 84px; object-fit: cover; margin: 0 auto 8px; }
    .wordmark { font-family: "Brush Script MT", "Segoe Script", cursive; font-size: 48px; letter-spacing: -2px; margin: 0 0 28px; font-weight: 500; }
    input { display: block; width: 100%; height: 38px; margin: 0 0 7px; padding: 9px 8px; border: 1px solid #dbdbdb; border-radius: 3px; background: #fafafa; font-size: 12px; outline-color: #a8a8a8; }
    button { width: 100%; border: 0; border-radius: 8px; margin-top: 8px; padding: 9px; background: #4cb5f9; color: white; font-weight: 600; font-size: 14px; cursor: pointer; }
    .divider { display: flex; align-items: center; gap: 16px; margin: 20px 0; color: #737373; font-size: 12px; font-weight: 600; }
    .divider::before, .divider::after { content: ""; height: 1px; background: #dbdbdb; flex: 1; }
    .link { display: block; margin: 15px 0; color: #385185; font-weight: 600; }
    .forgot { color: #00376b; font-size: 12px; font-weight: 400; margin-top: 20px; }
    .signup { background: white; border: 1px solid #dbdbdb; margin-top: 10px; padding: 20px; text-align: center; }
    .signup a { color: #0095f6; font-weight: 600; }
    .app { text-align: center; margin-top: 20px; }
    .badges { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
    .badge { background: #111; color: white; border-radius: 5px; padding: 8px 12px; font-size: 11px; }
    .notice { margin: 14px 0 0; color: #737373; font-size: 12px; line-height: 1.5; }
    @media (max-width: 700px) { .layout { padding: 16px; } .column { width: min(350px, calc(100vw - 32px)); } .panel { padding: 30px 24px 22px; border-color: transparent; background: transparent; } .signup { background: transparent; } }
  </style>
</head>
<body>
  <main class="layout">
    <section class="column">
      <div class="panel">
        <img class="brand-logo" src="{% static 'website/instagram-logo.jpg' %}" alt="Instagram logo">
        <h1 class="wordmark">Instagram</h1>
        <form id="demo-form" autocomplete="off">
          <input type="text" aria-label="Phone number, username, or email" placeholder="Phone number, username, or email">
          <input type="password" aria-label="Password" placeholder="Password">
          <button type="submit">Log in</button>
        </form>
        <div class="divider">OR</div>
        <a class="link">Log in with Facebook</a>
        <a class="link forgot">Forgot password?</a>
      </div>
      <div class="signup">Don't have an account? <a>Sign up</a></div>
      <div class="app">Get the app<div class="badges"><span class="badge">App Store</span><span class="badge">Google Play</span></div></div>
      <p class="notice">Visual demo only. The form does not submit or save anything.</p>
    </section>
  </main>
  <script>document.getElementById('demo-form').addEventListener('submit', function (event) { event.preventDefault(); });</script>
</body>
</html>
